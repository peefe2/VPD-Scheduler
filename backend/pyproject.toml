[project]
name = "vpd-smartfarm-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "lightgbm>=4.7.0",
    "google-genai>=2.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
